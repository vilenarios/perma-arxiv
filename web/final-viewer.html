<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArXiv Archive - Permanent Edition</title>
    <script type="module">
        import * as duckdb from 'https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@latest/+esm';
        window.duckdb = duckdb;
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .stat {
            text-align: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            margin-top: 5px;
        }

        .search-box {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .search-input {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            transition: border-color 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        select, button {
            padding: 10px 15px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            font-weight: 500;
        }

        button:hover {
            background: #764ba2;
            transform: translateY(-1px);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .results {
            background: white;
            border-radius: 12px;
            padding: 20px;
            min-height: 400px;
        }

        .paper {
            padding: 20px;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.3s;
        }

        .paper:hover {
            background: #f8f9fa;
        }

        .paper:last-child {
            border-bottom: none;
        }

        .paper-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            cursor: pointer;
        }

        .paper-title:hover {
            color: #667eea;
        }

        .paper-meta {
            display: flex;
            gap: 20px;
            margin: 10px 0;
            font-size: 13px;
            color: #666;
            flex-wrap: wrap;
        }

        .paper-summary {
            font-size: 14px;
            line-height: 1.6;
            color: #555;
            margin: 15px 0;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .paper-links {
            display: flex;
            gap: 10px;
        }

        .paper-link {
            padding: 6px 12px;
            background: #f0f0f0;
            border-radius: 4px;
            font-size: 12px;
            color: #666;
            text-decoration: none;
            transition: all 0.3s;
        }

        .paper-link:hover {
            background: #667eea;
            color: white;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .info-banner {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
        }

        .data-usage {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-size: 12px;
            max-width: 250px;
        }

        .data-usage-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .data-usage-stat {
            display: flex;
            justify-content: space-between;
            margin: 3px 0;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .page-btn {
            padding: 8px 12px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            cursor: pointer;
        }

        .page-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        @media (max-width: 768px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
            .filters {
                flex-direction: column;
            }
            select, button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 ArXiv Paper Archive</h1>
            <div class="subtitle">
                <span id="archiveInfo">Permanent archive powered by Arweave</span>
            </div>
            <div class="stats">
                <div class="stat">
                    <div class="stat-value" id="totalPapers">-</div>
                    <div class="stat-label">Papers</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="uploadedCount">-</div>
                    <div class="stat-label">On Arweave</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="dataSize">-</div>
                    <div class="stat-label">Index Size</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="queryTime">-</div>
                    <div class="stat-label">Query Time</div>
                </div>
            </div>
        </header>

        <div class="search-box">
            <input type="text" class="search-input" id="searchInput"
                   placeholder="Search papers by title, abstract, or authors...">
            <div class="filters">
                <select id="categoryFilter">
                    <option value="">All Categories</option>
                </select>
                <select id="yearFilter">
                    <option value="">All Years</option>
                </select>
                <select id="sortBy">
                    <option value="published DESC">Newest First</option>
                    <option value="published ASC">Oldest First</option>
                    <option value="title">Title A-Z</option>
                </select>
                <button id="searchBtn">Search</button>
                <button id="browseBtn">Browse Latest</button>
            </div>
        </div>

        <div class="results">
            <div id="loading" class="loading">
                <h3>Initializing Archive...</h3>
                <p style="margin-top: 10px;">Connecting to Arweave permanent storage</p>
            </div>
            <div id="papers" style="display: none;"></div>
            <div id="pagination" class="pagination" style="display: none;"></div>
        </div>
    </div>

    <div class="data-usage" id="dataUsage" style="display: none;">
        <div class="data-usage-title">📊 Data Usage</div>
        <div class="data-usage-stat">
            <span>Downloaded:</span>
            <span id="bytesDownloaded">0 KB</span>
        </div>
        <div class="data-usage-stat">
            <span>Cached:</span>
            <span id="bytesCached">0 KB</span>
        </div>
        <div class="data-usage-stat">
            <span>Queries:</span>
            <span id="queryCount">0</span>
        </div>
    </div>

    <script type="module">
        // Configuration - will be replaced during deployment
        const PARQUET_TX_ID = '__PARQUET_TX_ID__'; // Replaced during deployment
        const PARQUET_URL = PARQUET_TX_ID.startsWith('__')
            ? null
            : `https://arweave.net/${PARQUET_TX_ID}`;

        let db = null;
        let conn = null;
        let currentPage = 1;
        const pageSize = 20;
        let totalPapers = 0;
        let bytesDownloaded = 0;
        let queryCount = 0;

        async function initDuckDB() {
            try {
                const JSDELIVR_BUNDLES = duckdb.getJsDelivrBundles();
                const bundle = await duckdb.selectBundle(JSDELIVR_BUNDLES);

                const worker_url = URL.createObjectURL(
                    new Blob([`importScripts("${bundle.mainWorker}");`], {type: 'text/javascript'})
                );

                const worker = new Worker(worker_url);
                const logger = new duckdb.ConsoleLogger();

                db = new duckdb.AsyncDuckDB(logger, worker);
                await db.instantiate(bundle.mainModule, bundle.pthreadWorker);
                URL.revokeObjectURL(worker_url);

                conn = await db.connect();
                console.log('DuckDB initialized');

                // Auto-load if TX ID is configured
                if (PARQUET_URL) {
                    await loadParquet(PARQUET_URL);
                } else {
                    showSetupInstructions();
                }
            } catch (error) {
                console.error('Failed to initialize DuckDB:', error);
                document.getElementById('loading').innerHTML =
                    '<div class="error">Failed to initialize. Please reload.</div>';
            }
        }

        async function loadParquet(url) {
            document.getElementById('loading').innerHTML =
                '<h3>Loading Archive...</h3><p>Using HTTP range requests for efficient data access</p>';

            try {
                // DuckDB will use range requests automatically!
                await conn.query(`
                    CREATE OR REPLACE TABLE papers AS
                    SELECT * FROM read_parquet('${url}')
                `);

                // Get stats (minimal data transfer)
                const stats = await conn.query(`
                    SELECT
                        COUNT(*) as total,
                        COUNT(DISTINCT primary_category) as categories,
                        COUNT(transaction_id) as uploaded,
                        MIN(published) as earliest,
                        MAX(published) as latest
                    FROM papers
                `);

                const statsData = stats.toArray()[0];
                totalPapers = statsData.total;

                document.getElementById('totalPapers').textContent = totalPapers.toLocaleString();
                document.getElementById('uploadedCount').textContent = statsData.uploaded.toLocaleString();

                // Estimate index size (rough)
                const estimatedSize = totalPapers * 500; // ~500 bytes per paper
                document.getElementById('dataSize').textContent = formatBytes(estimatedSize);

                // Update archive info
                const earliest = new Date(statsData.earliest).getFullYear();
                const latest = new Date(statsData.latest).getFullYear();
                document.getElementById('archiveInfo').textContent =
                    `${totalPapers.toLocaleString()} papers from ${earliest} to ${latest}`;

                await populateFilters();
                await browseLatest();

                document.getElementById('loading').style.display = 'none';
                document.getElementById('papers').style.display = 'block';
                document.getElementById('dataUsage').style.display = 'block';

            } catch (error) {
                console.error('Failed to load Parquet:', error);
                document.getElementById('loading').innerHTML =
                    `<div class="error">Failed to load archive: ${error.message}</div>`;
            }
        }

        async function populateFilters() {
            // Get unique categories (minimal data transfer)
            const categories = await conn.query(`
                SELECT DISTINCT primary_category
                FROM papers
                ORDER BY primary_category
                LIMIT 50
            `);

            const categorySelect = document.getElementById('categoryFilter');
            categories.toArray().forEach(row => {
                categorySelect.innerHTML += `<option value="${row.primary_category}">${row.primary_category}</option>`;
            });

            // Get years
            const years = await conn.query(`
                SELECT DISTINCT YEAR(published) as year
                FROM papers
                ORDER BY year DESC
                LIMIT 20
            `);

            const yearSelect = document.getElementById('yearFilter');
            years.toArray().forEach(row => {
                yearSelect.innerHTML += `<option value="${row.year}">${row.year}</option>`;
            });
        }

        async function searchPapers() {
            const searchText = document.getElementById('searchInput').value;
            const category = document.getElementById('categoryFilter').value;
            const year = document.getElementById('yearFilter').value;
            const sortBy = document.getElementById('sortBy').value;

            let whereClause = '1=1';

            if (searchText) {
                whereClause += ` AND (
                    LOWER(title) LIKE LOWER('%${searchText.replace(/'/g, "''")}%') OR
                    LOWER(summary) LIKE LOWER('%${searchText.replace(/'/g, "''")}%') OR
                    LOWER(authors) LIKE LOWER('%${searchText.replace(/'/g, "''")}%')
                )`;
            }

            if (category) {
                whereClause += ` AND primary_category = '${category}'`;
            }

            if (year) {
                whereClause += ` AND YEAR(published) = ${year}`;
            }

            const offset = (currentPage - 1) * pageSize;

            const query = `
                SELECT
                    id, title, authors, published, primary_category,
                    SUBSTRING(summary, 1, 300) as summary,
                    pdf_url, abstract_url, transaction_id
                FROM papers
                WHERE ${whereClause}
                ORDER BY ${sortBy}
                LIMIT ${pageSize} OFFSET ${offset}
            `;

            await executeQuery(query);
        }

        async function browseLatest() {
            const query = `
                SELECT
                    id, title, authors, published, primary_category,
                    SUBSTRING(summary, 1, 300) as summary,
                    pdf_url, abstract_url, transaction_id
                FROM papers
                ORDER BY published DESC
                LIMIT ${pageSize}
            `;

            await executeQuery(query);
        }

        async function executeQuery(query) {
            const startTime = Date.now();
            queryCount++;

            try {
                const result = await conn.query(query);
                const papers = result.toArray();

                const queryTime = Date.now() - startTime;
                document.getElementById('queryTime').textContent = `${queryTime}ms`;
                document.getElementById('queryCount').textContent = queryCount;

                // Estimate data transfer (very rough)
                const estimatedBytes = papers.length * 1000; // ~1KB per paper
                bytesDownloaded += estimatedBytes;
                document.getElementById('bytesDownloaded').textContent = formatBytes(bytesDownloaded);

                displayPapers(papers);

                // Count total results for pagination
                const countQuery = query.replace(/SELECT.*FROM/, 'SELECT COUNT(*) as count FROM')
                                       .replace(/ORDER BY.*$/, '')
                                       .replace(/LIMIT.*$/, '');
                const countResult = await conn.query(countQuery);
                const totalResults = countResult.toArray()[0].count;

                displayPagination(totalResults);

            } catch (error) {
                console.error('Query failed:', error);
                document.getElementById('papers').innerHTML =
                    `<div class="error">Query failed: ${error.message}</div>`;
            }
        }

        function displayPapers(papers) {
            if (papers.length === 0) {
                document.getElementById('papers').innerHTML =
                    '<div class="loading">No papers found</div>';
                return;
            }

            document.getElementById('papers').innerHTML = papers.map(paper => {
                const date = new Date(paper.published).toLocaleDateString();
                const hasArweave = paper.transaction_id && paper.transaction_id !== 'null';

                return `
                    <div class="paper">
                        <div class="paper-title" onclick="showDetails('${paper.id}')">
                            ${paper.title}
                        </div>
                        <div class="paper-meta">
                            <span>📅 ${date}</span>
                            <span>🏷️ ${paper.primary_category}</span>
                            ${hasArweave ? '<span>✅ Archived</span>' : ''}
                        </div>
                        <div class="paper-meta" style="color: #999;">
                            ${paper.authors}
                        </div>
                        <div class="paper-summary">
                            ${paper.summary}...
                        </div>
                        <div class="paper-links">
                            <a href="${paper.abstract_url}" target="_blank" class="paper-link">ArXiv Page</a>
                            <a href="${paper.pdf_url}" target="_blank" class="paper-link">PDF</a>
                            ${hasArweave ? `<a href="https://arweave.net/${paper.transaction_id}" target="_blank" class="paper-link">Permanent Copy</a>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function displayPagination(total) {
            const totalPages = Math.ceil(total / pageSize);
            const pagination = document.getElementById('pagination');

            if (totalPages <= 1) {
                pagination.style.display = 'none';
                return;
            }

            pagination.style.display = 'flex';

            let html = '';
            const maxButtons = 7;
            const halfButtons = Math.floor(maxButtons / 2);

            let start = Math.max(1, currentPage - halfButtons);
            let end = Math.min(totalPages, start + maxButtons - 1);

            if (end - start < maxButtons - 1) {
                start = Math.max(1, end - maxButtons + 1);
            }

            if (currentPage > 1) {
                html += `<button class="page-btn" onclick="goToPage(1)">First</button>`;
                html += `<button class="page-btn" onclick="goToPage(${currentPage - 1})">Prev</button>`;
            }

            for (let i = start; i <= end; i++) {
                html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
            }

            if (currentPage < totalPages) {
                html += `<button class="page-btn" onclick="goToPage(${currentPage + 1})">Next</button>`;
                html += `<button class="page-btn" onclick="goToPage(${totalPages})">Last</button>`;
            }

            pagination.innerHTML = html;
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return (bytes / Math.pow(k, i)).toFixed(2) + ' ' + sizes[i];
        }

        function showSetupInstructions() {
            document.getElementById('loading').innerHTML = `
                <div class="info-banner">
                    <h3>Setup Required</h3>
                    <p>To configure this viewer:</p>
                    <ol style="margin: 10px 0; padding-left: 20px;">
                        <li>Run: <code>npm run deploy:complete</code></li>
                        <li>The deployment will create a configured viewer</li>
                        <li>Access your permanent archive on Arweave</li>
                    </ol>
                    <p style="margin-top: 10px;">Or manually enter a Parquet transaction ID in the URL:</p>
                    <code>?parquet={transaction_id}</code>
                </div>
            `;
        }

        // Global functions
        window.goToPage = function(page) {
            currentPage = page;
            searchPapers();
        };

        window.showDetails = async function(paperId) {
            // Could open a modal with full paper details
            console.log('Show details for', paperId);
        };

        // Event listeners
        document.getElementById('searchBtn').addEventListener('click', () => {
            currentPage = 1;
            searchPapers();
        });

        document.getElementById('browseBtn').addEventListener('click', () => {
            currentPage = 1;
            browseLatest();
        });

        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                currentPage = 1;
                searchPapers();
            }
        });

        // Check for URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const parquetParam = urlParams.get('parquet');
        if (parquetParam) {
            PARQUET_URL = `https://arweave.net/${parquetParam}`;
        }

        // Initialize
        window.addEventListener('load', async () => {
            await initDuckDB();
        });
    </script>
</body>
</html>
