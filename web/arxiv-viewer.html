<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArXiv Paper Archive</title>
    <script type="module">
        import * as duckdb from 'https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@latest/+esm';
        import * as arrow from 'https://cdn.jsdelivr.net/npm/apache-arrow@latest/+esm';

        window.duckdb = duckdb;
        window.arrow = arrow;
    </script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg: #ffffff;
            --bg-secondary: #f3f4f6;
            --text: #111827;
            --text-secondary: #6b7280;
            --border: #e5e7eb;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        header {
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
        }

        .stats {
            display: flex;
            gap: 20px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 600;
            color: var(--text);
        }

        .controls {
            background: var(--bg-secondary);
            padding: 20px 0;
            border-bottom: 1px solid var(--border);
        }

        .control-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .search-box {
            flex: 1;
            min-width: 300px;
            padding: 10px 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--primary);
        }

        select {
            padding: 10px 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            font-size: 14px;
            cursor: pointer;
        }

        button {
            padding: 10px 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--primary-dark);
        }

        button:disabled {
            background: var(--text-secondary);
            cursor: not-allowed;
        }

        .papers {
            padding: 20px 0;
        }

        .paper {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            transition: box-shadow 0.2s;
        }

        .paper:hover {
            box-shadow: 0 4px 6px var(--shadow);
        }

        .paper-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 10px;
            cursor: pointer;
        }

        .paper-title:hover {
            color: var(--primary-dark);
        }

        .paper-authors {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .paper-meta {
            display: flex;
            gap: 20px;
            font-size: 13px;
            color: var(--text-secondary);
            flex-wrap: wrap;
        }

        .paper-categories {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .category-tag {
            padding: 2px 8px;
            background: var(--bg-secondary);
            border-radius: 4px;
            font-size: 12px;
            color: var(--text);
        }

        .paper-summary {
            margin-top: 15px;
            font-size: 14px;
            line-height: 1.6;
            color: var(--text);
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .paper-summary.expanded {
            -webkit-line-clamp: unset;
        }

        .paper-links {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        .paper-link {
            padding: 5px 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 13px;
            text-decoration: none;
            color: var(--text);
            transition: background 0.2s;
        }

        .paper-link:hover {
            background: var(--border);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .error {
            background: #fee;
            border: 1px solid #fcc;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            color: #c00;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 20px 0;
        }

        .file-input-wrapper {
            position: relative;
            display: inline-block;
        }

        .file-input {
            display: none;
        }

        .file-label {
            padding: 10px 20px;
            background: var(--bg);
            border: 2px dashed var(--border);
            border-radius: 8px;
            cursor: pointer;
            display: inline-block;
            transition: border-color 0.2s;
        }

        .file-label:hover {
            border-color: var(--primary);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg);
            border-radius: 12px;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 30px;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--bg-secondary);
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-size: 20px;
            color: var(--text-secondary);
        }

        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                align-items: flex-start;
            }

            .control-row {
                flex-direction: column;
            }

            .search-box {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <h1>📚 ArXiv Paper Archive</h1>
                <div class="stats">
                    <div class="stat-item">
                        <span class="stat-value" id="totalPapers">0</span>
                        <span>Papers</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="totalCategories">0</span>
                        <span>Categories</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="uploadedCount">0</span>
                        <span>On Arweave</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="controls">
        <div class="container">
            <div class="control-row">
                <input type="text" class="search-box" id="searchInput" placeholder="Search papers by title, abstract, or authors...">
                <select id="categoryFilter">
                    <option value="">All Categories</option>
                </select>
                <select id="yearFilter">
                    <option value="">All Years</option>
                </select>
                <select id="sortBy">
                    <option value="published DESC">Newest First</option>
                    <option value="published ASC">Oldest First</option>
                    <option value="title ASC">Title A-Z</option>
                </select>
            </div>
            <div class="control-row">
                <div class="file-input-wrapper">
                    <input type="file" id="parquetFile" class="file-input" accept=".parquet">
                    <label for="parquetFile" class="file-label">📂 Load Local Parquet</label>
                </div>
                <input type="text" id="arweaveUrl" placeholder="Or enter Arweave transaction ID..." style="flex: 1; padding: 10px 15px; border: 1px solid var(--border); border-radius: 8px;">
                <button id="loadArweave">Load from Arweave</button>
                <button id="searchBtn">🔍 Search</button>
            </div>
        </div>
    </div>

    <main class="container">
        <div id="loading" class="loading">
            Please load a Parquet file or enter an Arweave transaction ID to begin...
        </div>
        <div id="papers" class="papers" style="display: none;"></div>
        <div id="pagination" class="pagination" style="display: none;"></div>
    </main>

    <div id="paperModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">×</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <script type="module">
        let db = null;
        let conn = null;
        let currentPage = 1;
        const pageSize = 20;

        // Initialize DuckDB
        async function initDuckDB() {
            const JSDELIVR_BUNDLES = duckdb.getJsDelivrBundles();

            const bundle = await duckdb.selectBundle(JSDELIVR_BUNDLES);
            const worker_url = URL.createObjectURL(
                new Blob([`importScripts("${bundle.mainWorker}");`], {type: 'text/javascript'})
            );

            const worker = new Worker(worker_url);
            const logger = new duckdb.ConsoleLogger();

            db = new duckdb.AsyncDuckDB(logger, worker);
            await db.instantiate(bundle.mainModule, bundle.pthreadWorker);
            URL.revokeObjectURL(worker_url);

            conn = await db.connect();
        }

        // Load Parquet file
        async function loadParquet(file) {
            try {
                document.getElementById('loading').innerHTML = 'Loading Parquet file...';

                const arrayBuffer = await file.arrayBuffer();
                await db.registerFileBuffer(file.name, new Uint8Array(arrayBuffer));

                // Create table from Parquet
                await conn.query(`DROP TABLE IF EXISTS papers`);
                await conn.query(`CREATE TABLE papers AS SELECT * FROM read_parquet('${file.name}')`);

                // Get statistics
                const stats = await conn.query(`
                    SELECT
                        COUNT(*) as total,
                        COUNT(DISTINCT primary_category) as categories,
                        COUNT(transaction_id) as uploaded
                    FROM papers
                `);

                const statsData = stats.toArray()[0];
                // Convert BigInt to Number for display
                const total = Number(statsData.total);
                const categories = Number(statsData.categories);
                const uploaded = Number(statsData.uploaded);

                document.getElementById('totalPapers').textContent = total.toLocaleString();
                document.getElementById('totalCategories').textContent = categories;
                document.getElementById('uploadedCount').textContent = uploaded;

                // Populate filters
                await populateFilters();

                // Initial load
                await searchPapers();

                document.getElementById('loading').style.display = 'none';
                document.getElementById('papers').style.display = 'block';

            } catch (error) {
                console.error('Error loading Parquet:', error);
                document.getElementById('loading').innerHTML = `
                    <div class="error">Error loading file: ${error.message}</div>
                `;
            }
        }

        // Load from Arweave
        async function loadFromArweave() {
            const txId = document.getElementById('arweaveUrl').value.trim();
            if (!txId) {
                alert('Please enter an Arweave transaction ID');
                return;
            }

            try {
                document.getElementById('loading').innerHTML = 'Loading from Arweave...';
                document.getElementById('loading').style.display = 'block';

                const response = await fetch(`https://arweave.net/${txId}`);
                if (!response.ok) throw new Error('Failed to fetch from Arweave');

                const blob = await response.blob();
                const file = new File([blob], 'arxiv.parquet', { type: 'application/octet-stream' });
                await loadParquet(file);

            } catch (error) {
                console.error('Error loading from Arweave:', error);
                document.getElementById('loading').innerHTML = `
                    <div class="error">Error loading from Arweave: ${error.message}</div>
                `;
            }
        }

        // Populate filter dropdowns
        async function populateFilters() {
            // Categories
            const categories = await conn.query(`
                SELECT DISTINCT primary_category
                FROM papers
                ORDER BY primary_category
            `);

            const categorySelect = document.getElementById('categoryFilter');
            categorySelect.innerHTML = '<option value="">All Categories</option>';
            categories.toArray().forEach(row => {
                categorySelect.innerHTML += `<option value="${row.primary_category}">${row.primary_category}</option>`;
            });

            // Years
            const years = await conn.query(`
                SELECT DISTINCT year
                FROM papers
                WHERE year IS NOT NULL
                ORDER BY year DESC
            `);

            const yearSelect = document.getElementById('yearFilter');
            yearSelect.innerHTML = '<option value="">All Years</option>';
            years.toArray().forEach(row => {
                yearSelect.innerHTML += `<option value="${row.year}">${row.year}</option>`;
            });
        }

        // Search papers
        async function searchPapers() {
            const searchTerm = document.getElementById('searchInput').value;
            const category = document.getElementById('categoryFilter').value;
            const year = document.getElementById('yearFilter').value;
            const sortBy = document.getElementById('sortBy').value;

            let whereClause = '1=1';

            if (searchTerm) {
                whereClause += ` AND (
                    LOWER(title) LIKE LOWER('%${searchTerm}%') OR
                    LOWER(summary) LIKE LOWER('%${searchTerm}%') OR
                    LOWER(authors) LIKE LOWER('%${searchTerm}%')
                )`;
            }

            if (category) {
                whereClause += ` AND primary_category = '${category}'`;
            }

            if (year) {
                whereClause += ` AND year = ${year}`;
            }

            const offset = (currentPage - 1) * pageSize;

            const query = `
                SELECT * FROM papers
                WHERE ${whereClause}
                ORDER BY ${sortBy}
                LIMIT ${pageSize} OFFSET ${offset}
            `;

            const countQuery = `SELECT COUNT(*) as total FROM papers WHERE ${whereClause}`;

            try {
                const results = await conn.query(query);
                const countResult = await conn.query(countQuery);
                const totalCount = Number(countResult.toArray()[0].total); // Convert BigInt to Number

                displayPapers(results.toArray());
                displayPagination(totalCount);

            } catch (error) {
                console.error('Search error:', error);
                document.getElementById('papers').innerHTML = `
                    <div class="error">Search error: ${error.message}</div>
                `;
            }
        }

        // Display papers
        function displayPapers(papers) {
            const container = document.getElementById('papers');

            if (papers.length === 0) {
                container.innerHTML = '<div class="loading">No papers found</div>';
                return;
            }

            container.innerHTML = papers.map(paper => {
                // Convert all BigInt fields to regular numbers/strings
                const convertedPaper = {};
                for (const key in paper) {
                    if (typeof paper[key] === 'bigint') {
                        convertedPaper[key] = Number(paper[key]);
                    } else {
                        convertedPaper[key] = paper[key];
                    }
                }
                paper = convertedPaper;
                const categories = paper.all_categories ? paper.all_categories.split(',').map(c => c.trim()) : [];
                const publishedDate = new Date(paper.published).toLocaleDateString();
                const hasTransactionId = paper.transaction_id && paper.transaction_id !== 'null';

                return `
                    <div class="paper">
                        <div class="paper-title" onclick="showPaperDetail('${paper.id}')">${paper.title}</div>
                        <div class="paper-authors">${paper.authors || 'Unknown authors'}</div>
                        <div class="paper-meta">
                            <span>📅 ${publishedDate}</span>
                            <span>🏷️ ${paper.primary_category}</span>
                            ${paper.version > 1 ? `<span>📝 v${paper.version}</span>` : ''}
                            ${hasTransactionId ? '<span>✅ On Arweave</span>' : ''}
                        </div>
                        <div class="paper-categories">
                            ${categories.map(cat => `<span class="category-tag">${cat}</span>`).join('')}
                        </div>
                        <div class="paper-summary" id="summary-${paper.id}">
                            ${paper.summary || 'No abstract available'}
                        </div>
                        <div class="paper-links">
                            <a href="${paper.abstract_url}" target="_blank" class="paper-link">📄 ArXiv Page</a>
                            ${hasTransactionId
                                ? `<a href="${paper.transaction_id}" target="_blank" class="paper-link">📥 PDF (Arweave)</a>`
                                : `<a href="${paper.pdf_url}" target="_blank" class="paper-link">📥 PDF (ArXiv)</a>`
                            }
                            <button onclick="toggleSummary('${paper.id}')" class="paper-link">📖 Read More</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Display pagination
        function displayPagination(total) {
            const totalPages = Math.ceil(total / pageSize);
            const container = document.getElementById('pagination');

            if (totalPages <= 1) {
                container.style.display = 'none';
                return;
            }

            container.style.display = 'flex';

            let html = '';

            if (currentPage > 1) {
                html += `<button onclick="goToPage(${currentPage - 1})">Previous</button>`;
            }

            for (let i = Math.max(1, currentPage - 2); i <= Math.min(totalPages, currentPage + 2); i++) {
                if (i === currentPage) {
                    html += `<button disabled>${i}</button>`;
                } else {
                    html += `<button onclick="goToPage(${i})">${i}</button>`;
                }
            }

            if (currentPage < totalPages) {
                html += `<button onclick="goToPage(${currentPage + 1})">Next</button>`;
            }

            container.innerHTML = html;
        }

        // Toggle summary expansion
        window.toggleSummary = function(paperId) {
            const summary = document.getElementById(`summary-${paperId}`);
            summary.classList.toggle('expanded');
        }

        // Go to page
        window.goToPage = function(page) {
            currentPage = page;
            searchPapers();
            window.scrollTo(0, 0);
        }

        // Show paper detail modal
        window.showPaperDetail = async function(paperId) {
            try {
                const result = await conn.query(`SELECT * FROM papers WHERE id = '${paperId}'`);
                const paper = result.toArray()[0];

                if (!paper) return;

                const modalBody = document.getElementById('modalBody');
                modalBody.innerHTML = `
                    <h2>${paper.title}</h2>
                    <div style="margin: 20px 0; color: var(--text-secondary);">
                        <p><strong>Authors:</strong> ${paper.authors || 'Unknown'}</p>
                        <p><strong>Published:</strong> ${new Date(paper.published).toLocaleDateString()}</p>
                        <p><strong>Updated:</strong> ${new Date(paper.updated).toLocaleDateString()}</p>
                        <p><strong>Categories:</strong> ${paper.all_categories}</p>
                        ${paper.journal_ref ? `<p><strong>Journal:</strong> ${paper.journal_ref}</p>` : ''}
                        ${paper.doi ? `<p><strong>DOI:</strong> ${paper.doi}</p>` : ''}
                        ${paper.comment ? `<p><strong>Comments:</strong> ${paper.comment}</p>` : ''}
                    </div>
                    <div style="margin: 20px 0;">
                        <h3>Abstract</h3>
                        <p style="line-height: 1.8; margin-top: 10px;">${paper.summary || 'No abstract available'}</p>
                    </div>
                    <div style="margin: 20px 0; display: flex; gap: 10px;">
                        <a href="${paper.abstract_url}" target="_blank" class="paper-link">📄 View on ArXiv</a>
                        ${paper.transaction_id && paper.transaction_id !== 'null'
                            ? `<a href="${paper.transaction_id}" target="_blank" class="paper-link">📥 Download PDF (Arweave)</a>`
                            : `<a href="${paper.pdf_url}" target="_blank" class="paper-link">📥 Download PDF (ArXiv)</a>`
                        }
                    </div>
                `;

                document.getElementById('paperModal').classList.add('active');
            } catch (error) {
                console.error('Error showing paper detail:', error);
            }
        }

        // Close modal
        window.closeModal = function() {
            document.getElementById('paperModal').classList.remove('active');
        }

        // Event listeners
        document.getElementById('parquetFile').addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                loadParquet(e.target.files[0]);
            }
        });

        document.getElementById('loadArweave').addEventListener('click', loadFromArweave);
        document.getElementById('searchBtn').addEventListener('click', () => {
            currentPage = 1;
            searchPapers();
        });

        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                currentPage = 1;
                searchPapers();
            }
        });

        document.getElementById('categoryFilter').addEventListener('change', () => {
            currentPage = 1;
            searchPapers();
        });

        document.getElementById('yearFilter').addEventListener('change', () => {
            currentPage = 1;
            searchPapers();
        });

        document.getElementById('sortBy').addEventListener('change', () => {
            currentPage = 1;
            searchPapers();
        });

        // Close modal on background click
        document.getElementById('paperModal').addEventListener('click', (e) => {
            if (e.target.id === 'paperModal') {
                closeModal();
            }
        });

        // Initialize on load
        window.addEventListener('load', async () => {
            await initDuckDB();
        });
    </script>
</body>
</html>
